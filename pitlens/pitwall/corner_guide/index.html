<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8edf4;color-scheme:dark;background:#0b0f14}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;font-size:12px;border:1px solid #303947;background:#151c26;color:#e8edf4;border-radius:6px;padding:7px 9px;cursor:pointer}button:hover,select:hover{border-color:#ff453e}button:focus-visible,select:focus-visible{outline:2px solid #55bfff;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.toolbar{display:flex;align-items:center;gap:6px;padding:5px 2px}select{min-width:0;flex:1}.hint{font-size:11px;color:#95a3b5;padding:6px 2px}svg{display:block;width:100%;height:300px;touch-action:pan-y}.road{fill:none;stroke:#293646;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}.line{fill:none;stroke:#b7c5d5;stroke-width:3;stroke-linejoin:round}.arc{fill:none;stroke:#ff453e;stroke-width:7;stroke-linecap:round;pointer-events:none}.corner{cursor:pointer;outline:none}.corner circle{fill:#111a25;stroke:#5c6c80;stroke-width:2;transition:fill .12s,stroke .12s}.corner text{fill:#d6e0ed;font-size:15px;font-weight:750;text-anchor:middle;dominant-baseline:central;pointer-events:none}.corner:hover circle,.corner:focus-visible circle,.corner.active circle{fill:#ff453e;stroke:#fff}.corner:hover text,.corner.active text{fill:white}#probe{fill:#55bfff;stroke:white;stroke-width:2;pointer-events:none}.detail{background:#121a24;border:1px solid #263242;border-radius:9px;padding:13px;margin:0 2px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:23px}h3{margin:0;font-size:16px}.tag{color:#9baabe;font-size:10px;text-transform:uppercase;letter-spacing:1px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.value{font-weight:750;font-size:23px}.unit{font-size:11px;font-weight:400;color:#a1adbc}.label{font-size:10px;color:#95a3b5;line-height:1.5}.note{margin-top:10px;color:#97a6b9;font-size:11px;line-height:1.5}.empty{opacity:.65}@media(max-width:420px){svg{height:270px}.value{font-size:20px}.toolbar{flex-wrap:wrap}.tag{letter-spacing:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="toolbar"><button id="play" aria-label="Play reference lap tour">▶ Tour lap</button><button id="prev" aria-label="Previous corner">←</button><select id="corners" aria-label="Choose a corner"></select><button id="next" aria-label="Next corner">→</button></div>
<div class="hint" id="hint">Hover a corner or the racing line. Click a corner to keep its details.</div>
<svg id="map" viewBox="0 0 800 540" role="group" aria-label="Interactive circuit corner guide"><polyline class="road" id="road"/><polyline class="line" id="line"/><polyline class="arc" id="arc"/><g id="markers"></g><circle id="probe" r="7"/></svg>
<div class="detail" role="status" aria-live="polite"><div class="heading"><h3 id="title">Corner guide</h3><span class="tag" id="kind">Reference lap</span></div><div class="metrics"><div><div class="value" id="speed">—</div><div class="label" id="speed-label">Minimum speed · km/h</div></div><div><div class="value" id="gear">—</div><div class="label" id="gear-label">Lowest gear</div></div><div><div class="value" id="brake">—</div><div class="label" id="brake-label">Brake-on approach · m</div></div></div><div class="note" id="note"></div></div>
<script>
const svgNS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);let tour=null, selected=0,playing=false,frame=null,started=0,lastSample=-1;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function resize(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+5})}
const points=rows=>rows.map(p=>p.join(',')).join(' ');
function stop(){playing=false;cancelAnimationFrame(frame);$('play').textContent='▶ Tour lap';$('play').setAttribute('aria-label','Play reference lap tour')}
function metric(id,value,unit=''){const e=$(id);e.textContent=value==null?'—':String(value);if(unit&&value!=null){const u=document.createElement('span');u.className='unit';u.textContent=' '+unit;e.append(u)}}
function mark(index){document.querySelectorAll('.corner').forEach((g,i)=>g.classList.toggle('active',i===index))}
function probe(sample){const p=tour.samples[sample].point;$('probe').setAttribute('cx',p[0]);$('probe').setAttribute('cy',p[1]);$('probe').style.display='';}
function showCorner(index,pin=false){if(!tour?.corners.length)return;if(pin){stop();selected=index;$('corners').value=index}const c=tour.corners[index];$('title').textContent=c.label+' · '+c.name;$('kind').textContent='Corner reference';metric('speed',c.speed);metric('gear',c.gear);metric('brake',c.brake_m);$('speed-label').textContent='Minimum speed · km/h';$('gear-label').textContent='Lowest gear';$('brake-label').textContent='Brake-on approach · m';$('note').textContent=tour.telemetry?'Speed and gear: within ±60 m of the marker. Braking: sampled brake-on distance in the 250 m approach; approximate, not brake pressure.':'No telemetry is available for this reference. The numbered circuit geometry remains interactive.';const i=c.sample;$('arc').setAttribute('points',points(tour.points.slice(Math.max(0,i-9),Math.min(tour.points.length,i+10))));probe(i);mark(index)}
function showSample(index){const s=tour.samples[index];$('title').textContent=playing?'Reference lap tour':'Racing-line sample';$('kind').textContent=Math.round(index/(tour.samples.length-1)*100)+'% of sampled lap';metric('speed',s.speed);metric('gear',s.gear);metric('brake',s.brake==null?null:s.brake?'ON':'OFF');$('speed-label').textContent='Sample speed · km/h';$('gear-label').textContent='Sample gear';$('brake-label').textContent='Brake signal';$('note').textContent='Values from the labelled reference lap. Tour motion follows sampled positions at a constant preview rate, not real lap time.';probe(index);$('arc').setAttribute('points',points(tour.points.slice(Math.max(0,index-8),index+1)));mark(-1)}
function moveCorner(offset){if(!tour?.corners.length)return;showCorner((selected+offset+tour.corners.length)%tour.corners.length,true)}
$('prev').onclick=()=>moveCorner(-1);$('next').onclick=()=>moveCorner(1);$('corners').onchange=()=>showCorner(Number($('corners').value),true);
$('map').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();moveCorner(e.key==='ArrowRight'?1:-1)}else if(e.key==='Escape'){stop();showCorner(selected)}});
$('map').addEventListener('pointermove',e=>{if(!tour||playing||e.target.closest('.corner'))return;const p=$('map').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($('map').getScreenCTM().inverse());let nearest=0,min=Infinity;tour.points.forEach((p,i)=>{const d=(p[0]-q.x)**2+(p[1]-q.y)**2;if(d<min){min=d;nearest=i}});if(min<45**2)showSample(nearest)});
$('map').addEventListener('pointerleave',()=>{if(!playing&&tour?.corners.length)showCorner(selected)});
$('play').onclick=()=>{if(playing){stop();showCorner(selected);return}playing=true;started=performance.now();lastSample=-1;$('play').textContent='Ⅱ Pause tour';$('play').setAttribute('aria-label','Pause reference lap tour');function tick(now){if(!playing)return;const index=Math.min(tour.samples.length-1,Math.floor((now-started)/22000*tour.samples.length));if(index!==lastSample){showSample(index);lastSample=index}if(index===tour.samples.length-1){stop();return}frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)};
function render(args){stop();tour=args.tour;selected=0;if(!tour?.points?.length)return;$('map').setAttribute('aria-label',args.name+' interactive circuit corner guide');$('road').setAttribute('points',points(tour.points));$('line').setAttribute('points',points(tour.points));$('corners').replaceChildren();$('markers').replaceChildren();tour.corners.forEach((c,i)=>{const option=document.createElement('option');option.value=i;option.textContent=c.label+' · '+c.name;$('corners').append(option);const g=document.createElementNS(svgNS,'g');g.setAttribute('class','corner');g.setAttribute('transform',`translate(${c.point})`);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',c.label+' '+c.name);const circle=document.createElementNS(svgNS,'circle');circle.setAttribute('r','19');const text=document.createElementNS(svgNS,'text');text.textContent=c.label;g.append(circle,text);g.onpointerenter=()=>{if(!playing)showCorner(i)};g.onfocus=()=>showCorner(i);g.onclick=()=>showCorner(i,true);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showCorner(i,true)}};$('markers').append(g)});['prev','next','corners'].forEach(id=>$(id).disabled=!tour.corners.length);if(tour.corners.length)showCorner(0);else{const o=document.createElement('option');o.textContent='Numbered markers unavailable';$('corners').append(o);$('hint').textContent='Hover the racing line to inspect reference-lap samples. Numbered markers are unavailable.';showSample(0)}resize()}
window.addEventListener('message',e=>{if(e.source===parent&&e.data.type==='streamlit:render')render(e.data.args)});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});new ResizeObserver(resize).observe(document.body);send('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>

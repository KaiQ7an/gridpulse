[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitlens"
version = "0.1.0"
description = "Race-engineering analysis of public F1 data with FastF1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.8",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "plotly>=6.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# Team radio to text with a local Whisper model (about 0.5 GB downloaded on first use).
transcribe = ["faster-whisper>=1.1"]
# Team radio into Chinese: a small offline model (about 70 MB on first use)...
translate = ["ctranslate2>=4", "sentencepiece>=0.2"]
# ...or Claude via the Anthropic API (needs an API key).
claude = ["anthropic>=1.0"]

[project.scripts]
pitlens = "pitlens.cli:main"

[tool.setuptools.packages.find]
include = ["pitlens*"]

[tool.setuptools.package-data]
"pitlens.pitwall.tower" = ["index.html"]

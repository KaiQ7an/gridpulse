[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitlens"
version = "0.1.0"
description = "GridPulse motorsport replay and analysis, currently powered by public F1 data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.8",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "plotly>=6.0",
    "requests>=2.31",
    # The pit wall uses top navigation, horizontal containers and light/dark theme sections.
    "streamlit>=1.66",
]

[project.optional-dependencies]
# Team radio to text with a local Whisper model (about 0.5 GB downloaded on first use).
transcribe = ["faster-whisper>=1.1"]
# Team radio into Chinese: a small offline model (about 70 MB on first use)...
translate = ["ctranslate2>=4", "sentencepiece>=0.2"]
# ...or Claude via the Anthropic API (needs an API key).
claude = ["anthropic>=1.0"]

[project.scripts]
pitlens = "pitlens.cli:main"

[project.urls]
Homepage = "https://gridpulse-racing.streamlit.app/"
Repository = "https://github.com/KaiQ7an/gridpulse"

[tool.setuptools.packages.find]
include = ["pitlens*"]

[tool.setuptools.package-data]
"pitlens.pitwall.tower" = ["index.html"]
"pitlens.pitwall.atlas_map" = ["index.html", "bridge.html", "d3.min.js", "D3-LICENSE", "world.json"]
"pitlens.pitwall.timeline" = ["index.html"]
"pitlens.pitwall.corner_guide" = ["index.html", "guide.js"]
"pitlens.season" = ["atlas.json", "corner_tours.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, pyupgrade, import order
select = ["F", "E9", "B", "UP", "I"]
ignore = ["B905"]  # zip(strict=...) adds noise where lengths are equal by construction
